[package]
name = "stockwave-vault"
version = "0.1.0"
edition = "2021"
description = "StockWave gift vault: holds tokenized stocks (NEAR Intents balances) and releases each gift to the holder of its function-call key."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.15.1"

[dev-dependencies]
near-sdk = { version = "=5.15.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
